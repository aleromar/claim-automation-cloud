name: deploy

# Staged deploy pipeline (staging-environment REQ-3): every push to main deploys
# STAGING first, runs the live suite against the DEPLOYED staging (real Functions
# host — the runner-local gate could never see host-only failures: BLOB_ENDPOINT,
# platform CORS, run-from-package wipes), and only a green gate promotes the same
# SHA to PROD (auto-on-green, no manual approval). Docs-only pushes run nothing
# (path filter). workflow_dispatch forces all deploys (the provision-recovery
# path) but still runs the live gate UNLESS skip_live_e2e is checked — the escape
# hatch for "the suite is broken for external reasons and the app must ship".
# NOTE the escape still requires the STAGING DEPLOY itself to succeed; a broken
# staging environment blocks prod even with the flag (accepted edge, spec
# Confidence notes).
#
# Per-env names come from GitHub *environment* variables (staging/production):
# FUNCTIONAPP_NAME, SWA_NAME, and for staging additionally SWA_HOSTNAME and
# KEY_VAULT_NAME — copied from the infra deploy's printed outputs at provision
# time (staging-environment runbook).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      skip_live_e2e:
        description: "Skip the live e2e gate (emergency deploy only)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# One live run at a time — two runs would race on the single real mailbox AND
# the single staging environment. cancel-in-progress stays false: a cancelled
# run aborts teardown mid-mutation.
concurrency:
  group: live-e2e
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # paths-filter handles the push edge cases a raw git diff gets wrong:
      # zero-`before` on branch creation, force pushes, multi-commit merges.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
            frontend:
              - "frontend/**"

  deploy-staging-functions:
    needs: [changes]
    if: >-
      github.ref == 'refs/heads/main'
      && (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Hard wall-clock bound: the smoke poll alone can burn ~5.5 min, and a
    # hung connection must fail the run, not stall it against the 6 h cap.
    timeout-minutes: 20
    environment: staging
    env:
      FUNCTIONAPP_NAME: ${{ vars.FUNCTIONAPP_NAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # The workflow is the only place that knows the SHA (version-display REQ-2.1);
      # the file is gitignored and travels inside the artifact. Must run before
      # the functions-action package step below — that's the step that zips
      # backend/ (vendoring never touches app/).
      - name: Stamp build version into the artifact
        run: echo "${GITHUB_SHA}" > backend/app/build_version.txt

      # On Linux Consumption with RBAC the functions-action forces
      # WEBSITE_RUN_FROM_PACKAGE and skips the Oryx remote build, so the
      # package must ship its dependencies in .python_packages (the path the
      # Python worker adds to sys.path).
      - name: Vendor dependencies for run-from-package
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.txt
          uv pip install --python 3.12 \
            --target .python_packages/lib/site-packages -r requirements.txt

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@bc63708cc6539760eea18d8a7de4ce8ef5fdf593 # v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME }}
          package: backend
          respect-funcignore: true

      # Poll until health reports the deployed SHA (version-display REQ-2.3).
      # curl --retry is not enough: old instances answer 200 with the previous
      # version during the package swap, and a lost stamp answers "dev".
      # For staging this doubles as the live gate's precondition: the suite
      # runs only against the pushed SHA (staging-environment REQ-3.2).
      - name: Smoke — health reports the deployed version
        run: |
          sleep 30
          last=""
          for i in $(seq 1 20); do
            last=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              "https://${FUNCTIONAPP_NAME}.azurewebsites.net/api/health" \
              | jq -r '.version // empty' || true)
            if [ "${last}" = "${GITHUB_SHA}" ]; then
              echo "Deployed version confirmed: ${last}"
              exit 0
            fi
            echo "attempt ${i}/20: observed '${last:-no response}', want ${GITHUB_SHA}; retrying in 15s"
            sleep 15
          done
          echo "ERROR: health never reported ${GITHUB_SHA}; last observed: '${last:-no response}'"
          echo "('dev' = stamp lost from the package; an old SHA = package not swapped)"
          exit 1

  deploy-staging-swa:
    needs: [changes]
    if: >-
      github.ref == 'refs/heads/main'
      && (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: staging
    env:
      FUNCTIONAPP_NAME: ${{ vars.FUNCTIONAPP_NAME }}
      SWA_NAME: ${{ vars.SWA_NAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build with this env's API origin (deployment REQ-4.2) + version stamp (version-display REQ-2.2)
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE_URL="https://${FUNCTIONAPP_NAME}.azurewebsites.net" \
            VITE_BUILD_VERSION="${GITHUB_SHA}" npm run build

      # A mis-named env var would silently ship a "dev" footer (version-display REQ-2.5).
      - name: Verify the build stamp landed in the bundle
        run: grep -rq "${GITHUB_SHA}" frontend/dist

      - name: Fetch SWA deployment token at run time (REQ-3.3 — never stored)
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "${SWA_NAME}" --query properties.apiKey -o tsv)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

  live-e2e:
    needs: [changes, deploy-staging-functions, deploy-staging-swa]
    # always() overrides the implied success(): on an e2e-only or docs-adjacent
    # push both staging deploys are 'skipped' (nothing to deploy) and the gate
    # must still run — against staging's already-deployed code, whose SHA the
    # suite never asserts (staging-environment REQ-3.2). A FAILED staging
    # deploy still blocks the gate (result must be success or skipped).
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_dispatch' || !inputs.skip_live_e2e)
      && needs.changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.deploy-staging-functions.result)
      && contains(fromJSON('["success", "skipped"]'), needs.deploy-staging-swa.result)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `environment: staging` gives the OIDC token the environment:staging
    # subject (matched by the app-staging federated credential) and resolves
    # the AZURE_* secrets from that environment. The eight third-party
    # credentials stay REPO-level secrets (gh secret set -f e2e/.env.live):
    # Gmail/Trello have no OIDC path — D15 clarification, structure.md.
    environment: staging
    env:
      GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
      TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
      LIVE_FRONTEND_URL: https://${{ vars.SWA_HOSTNAME }}
      LIVE_BACKEND_API_URL: https://${{ vars.FUNCTIONAPP_NAME }}.azurewebsites.net/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install e2e deps + browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The suite mints the operator JWT itself (no login flow — it would
      # overwrite staging's real gmail-refresh-token). Key Vault is the key's
      # only home; CI fetches it per run (staging-environment REQ-3.3/4.2).
      - name: Fetch the staging session signing key
        run: |
          key=$(az keyvault secret show --vault-name "${{ vars.KEY_VAULT_NAME }}" \
            --name session-signing-key --query value -o tsv)
          echo "::add-mask::${key}"
          echo "SESSION_SIGNING_KEY=${key}" >> "$GITHUB_ENV"

      - name: Run live Playwright suite (real Gmail + Trello vs deployed staging)
        working-directory: e2e
        run: npx playwright test -c playwright.live.config.ts

  deploy-prod-functions:
    # Staging results are checked DIRECTLY (not just live-e2e): a failed staging
    # deploy skips the gate, and "skipped" alone would wave prod through.
    needs: [changes, deploy-staging-functions, deploy-staging-swa, live-e2e]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.deploy-staging-functions.result)
      && contains(fromJSON('["success", "skipped"]'), needs.deploy-staging-swa.result)
      && contains(fromJSON('["success", "skipped"]'), needs.live-e2e.result)
      && (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      FUNCTIONAPP_NAME: ${{ vars.FUNCTIONAPP_NAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Stamp build version into the artifact
        run: echo "${GITHUB_SHA}" > backend/app/build_version.txt

      - name: Vendor dependencies for run-from-package
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.txt
          uv pip install --python 3.12 \
            --target .python_packages/lib/site-packages -r requirements.txt

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@bc63708cc6539760eea18d8a7de4ce8ef5fdf593 # v1
        with:
          app-name: ${{ env.FUNCTIONAPP_NAME }}
          package: backend
          respect-funcignore: true

      - name: Smoke — health reports the deployed version
        run: |
          sleep 30
          last=""
          for i in $(seq 1 20); do
            last=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              "https://${FUNCTIONAPP_NAME}.azurewebsites.net/api/health" \
              | jq -r '.version // empty' || true)
            if [ "${last}" = "${GITHUB_SHA}" ]; then
              echo "Deployed version confirmed: ${last}"
              exit 0
            fi
            echo "attempt ${i}/20: observed '${last:-no response}', want ${GITHUB_SHA}; retrying in 15s"
            sleep 15
          done
          echo "ERROR: health never reported ${GITHUB_SHA}; last observed: '${last:-no response}'"
          echo "('dev' = stamp lost from the package; an old SHA = package not swapped)"
          exit 1

  deploy-prod-swa:
    needs: [changes, deploy-staging-functions, deploy-staging-swa, live-e2e]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.deploy-staging-functions.result)
      && contains(fromJSON('["success", "skipped"]'), needs.deploy-staging-swa.result)
      && contains(fromJSON('["success", "skipped"]'), needs.live-e2e.result)
      && (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    env:
      FUNCTIONAPP_NAME: ${{ vars.FUNCTIONAPP_NAME }}
      SWA_NAME: ${{ vars.SWA_NAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build with this env's API origin (deployment REQ-4.2) + version stamp (version-display REQ-2.2)
        working-directory: frontend
        run: |
          npm ci
          VITE_API_BASE_URL="https://${FUNCTIONAPP_NAME}.azurewebsites.net" \
            VITE_BUILD_VERSION="${GITHUB_SHA}" npm run build

      - name: Verify the build stamp landed in the bundle
        run: grep -rq "${GITHUB_SHA}" frontend/dist

      - name: Fetch SWA deployment token at run time (REQ-3.3 — never stored)
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "${SWA_NAME}" --query properties.apiKey -o tsv)
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
