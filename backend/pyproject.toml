[project]
name = "claim-automation-backend"
version = "0.1.0"
description = "Claim Automation (Cloud) backend — FastAPI on Azure Functions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "azure-functions>=1.21",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "httpx>=0.28",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-data-tables>=12.5",
    "reportlab>=5.0",
    "pillow>=10.0",
    "azure-storage-blob>=12.24",
    # otel-observability (D28): pipeline/ imports the API directly, so it is
    # a first-class dependency, not a transitive accident.
    "opentelemetry-api>=1.43.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b56",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "azure-core-tracing-opentelemetry>=1.0.0b13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "respx>=0.23.1",
    "anyio>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
