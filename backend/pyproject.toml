[project]
name = "claim-automation-backend"
version = "0.1.0"
description = "Claim Automation (Cloud) backend — FastAPI on Azure Functions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "azure-functions>=1.21",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "httpx>=0.28",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-data-tables>=12.5",
    "reportlab>=5.0",
    "pillow>=10.0",
    "azure-storage-blob>=12.24",
    # otel-observability (D28): pipeline/ imports the API directly, so it is
    # a first-class dependency, not a transitive accident.
    "opentelemetry-api>=1.43.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b56",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "azure-core-tracing-opentelemetry>=1.0.0b13",
    # llm-extraction (D29): the one exact pin in this file — Pydantic AI ships
    # weekly and has already moved constructor kwargs between majors; the
    # extractor is written against this version's API (spec Design).
    "pydantic-ai-slim[openai]==2.43.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "respx>=0.23.1",
    "anyio>=4",
    # llm-extraction REQ-6: eval harness (same pin as the runtime) + cassettes.
    "pydantic-evals==2.43.0",
    "pytest-recording>=0.13.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# llm-extraction REQ-6.4: the live tier is never collected by default —
# `pytest -m llm_live` on the command line overrides this `-m`.
markers = [
    "llm_replay: Tier 2 — replays recorded Foundry answers from tests/cassettes (socket-free)",
    "llm_live: Tier 3 — calls the staging Foundry deployment; nightly workflow only",
]
addopts = "--strict-markers -m 'not llm_live'"

[tool.ruff]
line-length = 100
target-version = "py312"
