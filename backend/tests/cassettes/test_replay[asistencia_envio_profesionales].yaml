      spelling, casing, accents,\\n  punctuation), except: join lines the mail client
      hard-wrapped with a single space, and trim\\n  leading/trailing whitespace.\\n-
      Every field the e-mail lacks is null. Never an empty string, never a placeholder
      such as\\n  \\\"no consta\\\", \\\"N/A\\\", \\\"-\\\" or the word \\\"null\\\"
      written as text.\\n\\nField rules (the section headings are \\\"Datos de la
      Entidad\\\", \\\"Datos del Asegurado\\\",\\n\\\"Datos del Siniestro\\\", \\\"Implicados\\\",
      \\\"Interviene\\\"):\\n- insurance_company: the value after \\\"Compa\xF1\xEDa:\\\"
